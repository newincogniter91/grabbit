name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grabbit.jks"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KPASS="$KEY_PASSWORD"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets found, generating a temporary key (no release will be published)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            PASS="grabbit-ci"; ALIAS="grabbit"; KPASS="grabbit-ci"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/grabbit.jks" -storepass "$PASS" \
              -keypass "$KPASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Grabbit"
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/grabbit.jks"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "grabbit-1.2.${{ github.run_number }}-${abi}.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: grabbit-apk
          path: grabbit-*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grabbit-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" grabbit-*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Grabbit 1.2.${{ github.run_number }}" \
            --notes "Install the arm64-v8a APK on almost all modern phones. The armeabi-v7a APK is only for old 32-bit devices." \
            --generate-notes
