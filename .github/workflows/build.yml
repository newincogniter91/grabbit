name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grabbit.jks"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KPASS="$KEY_PASSWORD"
          else
            echo "No signing secrets found, generating a temporary key."
            PASS="grabbit-ci"; ALIAS="grabbit"; KPASS="grabbit-ci"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/grabbit.jks" -storepass "$PASS" \
              -keypass "$KPASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Grabbit"
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/grabbit.jks"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "grabbit-1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: grabbit-apk
          path: grabbit-*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grabbit-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" grabbit-*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Grabbit 1.1.${{ github.run_number }}" \
            --generate-notes
